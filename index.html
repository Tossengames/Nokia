<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nokia Nostalgia Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div id="menu" class="panel">
    <h1>🤳 Nokia Nostalgia</h1>
    <p>How well do you remember the bricks?</p>
    <button class="menu-btn" id="play-btn">Start Quiz</button>
    <button class="menu-btn" id="info-btn">How to Play</button>
    <button class="menu-btn" id="support-btn">Support</button>
  </div>

  <div id="info-screen" class="panel hidden">
    <h2>Instructions</h2>
    <p>Test your 2000s knowledge! You'll face 5 random questions about classic Nokia devices.</p>
    <button class="menu-btn" id="info-back">Back</button>
  </div>

  <div id="support-screen" class="panel hidden">
    <h2>Support</h2>
    <p>Keep the nostalgia alive! Check out our Ko-fi page.</p>
    <button class="menu-btn" id="support-back">Back</button>
  </div>

  <div id="quiz-screen" class="panel hidden">
    <div class="status-bar">
      <span id="progress">Question 1/5</span>
      <span id="score">Score: 0</span>
    </div>
    <h3 id="question-text">Loading...</h3>
    
    <div id="options-container"></div>

    <div id="feedback-panel" class="hidden">
      <div id="feedback-content"></div>
      <button id="next-btn" class="menu-btn">Next Question →</button>
    </div>
  </div>

  <div id="result-screen" class="panel hidden">
    <h2>Quiz Complete!</h2>
    <div id="final-stats"></div>
    <div id="rank-message"></div>
    <button class="menu-btn" onclick="location.reload()">Try Again</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
